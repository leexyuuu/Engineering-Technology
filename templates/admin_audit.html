{% extends "base.html" %}
{% block title %}对话审计{% endblock %}
{% block nav_audit %}active{% endblock %}

{% block content %}
<div class="page-head">
  <h2>对话审计</h2>
  <p class="sub">按角色 / 时间 / 关键词筛选对话记录；对疑似违规的问答（如试图绕过选课资格）进行标记。</p>
</div>

<!-- ── 筛选表单 ── -->
<div class="card">
  <div class="filter-row">
    <label>角色
      <select id="fRole">
        <option value="">全部</option>
        <option value="student">学生</option>
        <option value="teacher">教师</option>
        <option value="admin">管理员</option>
      </select>
    </label>
    <label>开始日期 <input type="date" id="fStart"></label>
    <label>结束日期 <input type="date" id="fEnd"></label>
    <label>关键词 <input type="text" id="fKeyword" placeholder="消息内容包含…" maxlength="50"></label>
    <label class="ck"><input type="checkbox" id="fFlagged"> 仅看已标记</label>
    <button class="btn-primary" id="fBtn">查 询</button>
  </div>
</div>

<!-- ── 结果表格 ── -->
<div class="card">
  <h3>对话记录 <span class="badge" id="total">-</span></h3>
  <table class="table">
    <thead>
      <tr><th>时间</th><th>用户</th><th>角色</th><th>类型</th><th>内容</th><th>引用</th><th>状态</th><th>操作</th></tr>
    </thead>
    <tbody id="rows"><tr><td colspan="8" class="empty">加载中…</td></tr></tbody>
  </table>
  <div class="pager">
    <button class="btn-ghost" id="prevBtn">上一页</button>
    <span id="pageInfo">-</span>
    <button class="btn-ghost" id="nextBtn">下一页</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let page = 1, totalPages = 1;

/* ── 组装查询串并加载 ── */
async function load() {
  const qs = new URLSearchParams({
    role: document.getElementById('fRole').value,
    start: document.getElementById('fStart').value,
    end: document.getElementById('fEnd').value,
    keyword: document.getElementById('fKeyword').value.trim(),
    flagged: document.getElementById('fFlagged').checked,
    page, page_size: 20,
  });
  const tbody = document.getElementById('rows');
  try {
    const d = await api('/api/admin/audit/messages?' + qs.toString());
    totalPages = Math.max(1, Math.ceil(d.total / d.page_size));
    document.getElementById('total').textContent = `共 ${d.total} 条`;
    document.getElementById('pageInfo').textContent = `${d.page} / ${totalPages} 页`;

    if (!d.items.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty">无符合条件的记录</td></tr>';
      return;
    }
    const ROLE_CN = { student: '学生', teacher: '教师', admin: '管理员' };
    tbody.innerHTML = d.items.map(m => `
      <tr>
        <td class="t">${m.created_at}</td>
        <td>${m.real_name}<div class="sub2">${m.username}</div></td>
        <td>${ROLE_CN[m.user_role] || m.user_role}</td>
        <td>${m.msg_role === 'user' ? '🧑 提问' : '🤖 回答'}</td>
        <td class="c" title="双击查看完整内容">${esc(m.content)}</td>
        <td>${m.msg_role === 'assistant' ? m.citations_count + ' 条' : '-'}</td>
        <td>${m.is_flagged
              ? `<span class="flag-on">⚠ 已标记</span><div class="sub2">${esc(m.flag_reason)}</div>`
              : '<span class="flag-off">正常</span>'}</td>
        <td>${m.is_flagged
              ? `<button class="btn-ghost" onclick="flag(${m.id}, false)">取消标记</button>`
              : `<button class="btn-danger" onclick="flag(${m.id}, true)">标记违规</button>`}</td>
      </tr>`).join('');
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty">加载失败：${e.message}</td></tr>`;
  }
}

/* HTML 转义（内容来自用户输入，防注入） */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ── 标记/取消疑似违规 ── */
async function flag(id, flagged) {
  let reason = '';
  if (flagged) {
    reason = prompt('请填写标记原因（必填，如：试图绕过先修课要求直接选课）：', '');
    if (reason === null) return;                 // 用户取消
    if (!reason.trim()) { alert('标记原因不能为空'); return; }
  } else if (!confirm('确认取消该消息的违规标记？')) {
    return;
  }
  try {
    await api(`/api/admin/audit/messages/${id}/flag`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ flagged, reason }),
    });
    load();
  } catch (e) {
    alert('操作失败：' + e.message);
  }
}

/* ── 事件绑定 ── */
document.getElementById('fBtn').addEventListener('click', () => { page = 1; load(); });
document.getElementById('prevBtn').addEventListener('click', () => {
  if (page > 1) { page--; load(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (page < totalPages) { page++; load(); }
});
document.getElementById('rows').addEventListener('dblclick', (e) => {
  const td = e.target.closest('td.c');
  if (td) alert(td.getAttribute('title'));
});

load();
</script>
{% endblock %}
